# Blueprint do Render: uma aplicação Docker (Angular + Spring Boot) + PostgreSQL, plano gratuito.
# Deploy automático só depois que os checks do GitHub Actions passam.
# Limites do plano gratuito: dorme após 15 min sem tráfego (~1 min para acordar);
# PostgreSQL gratuito com 1 GB, sem backup, expira 30 dias após a criação.
services:
  - type: web
    name: ponto-falante
    runtime: docker
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-falante-db
          property: connectionString
      - key: PF_SALT
        generateValue: true
      - key: RPA_API_KEY
        generateValue: true
      - key: VISAO_API_KEY
        generateValue: true
      - key: DISPOSITIVO_API_KEY
        generateValue: true
      - key: DADOS_API_KEY
        generateValue: true
      - key: SPTRANS_TOKEN
        sync: false
      # Gateway oficial da Prefeitura (apilib): Consumer Key/Secret. Preenchidos, têm prioridade sobre SPTRANS_TOKEN.
      - key: SPTRANS_GATEWAY_CHAVE
        sync: false
      - key: SPTRANS_GATEWAY_SEGREDO
        sync: false
      - key: SPTRANS_BASE_URL
        value: https://api.olhovivo.sptrans.com.br/v2.1
      - key: PF_SPTRANS_MODO
        value: demo
      - key: GENAI_URL
        sync: false
      - key: GENAI_API_KEY
        generateValue: true

databases:
  - name: ponto-falante-db
    plan: free
    region: oregon
    databaseName: pontofalante
    user: pontofalante
