# Coletor de amostras REAIS de previsão (robô RPA): 8 execuções por dia, das 07h às 21h de São Paulo.
# Cada execução consulta os pontos de rpa/config/monitoramento.yaml no MVP publicado e grava as amostras em
# POST /api/rpa/amostras. O boletim diário (rpa-diario.yml) estima a espera por linha a partir delas.
# Custo: 1 job curto por execução (cerca de 1 minuto faturado; até 2 se o Render estiver dormindo),
# cerca de 240 a 480 minutos por mês. Segredos: MVP_URL e RPA_API_KEY (os mesmos do rpa-diario).
name: rpa-coleta

on:
  schedule:
    # UTC: 10,12,14,16,18,20,22,00 = 07,09,11,13,15,17,19,21 em São Paulo (UTC-3, sem horário de verão)
    - cron: "0 0,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rpa-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: rpa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rpa/requirements-coleta.txt
      - name: Verificar segredos
        env:
          MVP_URL: ${{ secrets.MVP_URL }}
          RPA_API_KEY: ${{ secrets.RPA_API_KEY }}
        run: |
          if [ -z "$MVP_URL" ] || [ -z "$RPA_API_KEY" ]; then
            echo "::error::Configure os segredos MVP_URL e RPA_API_KEY"; exit 1; fi
      - name: Recuperar lotes pendentes da execução anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anterior=$(gh run list --workflow rpa-coleta.yml --branch "$GITHUB_REF_NAME" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$anterior" ]; then
            if ! gh run download "$anterior" --name "rpa-coleta-$anterior" --dir .previous-coleta; then
              echo "::warning::Artefato anterior indisponível ou expirado; pendências anteriores não puderam ser recuperadas. A coleta atual continuará."
            fi
            if [ -d .previous-coleta/saida/pendentes ]; then
              mkdir -p rpa/saida/pendentes
              cp -a .previous-coleta/saida/pendentes/. rpa/saida/pendentes/
            fi
          fi
      - name: Acordar o MVP (plano gratuito dorme após 15 min)
        env:
          MVP_URL: ${{ secrets.MVP_URL }}
        run: |
          for i in $(seq 1 18); do curl -fsS -m 20 "${MVP_URL%/api}/actuator/health" && break; sleep 5; done
      - name: Coletar amostras
        working-directory: rpa
        env:
          MVP_URL: ${{ secrets.MVP_URL }}
          RPA_API_KEY: ${{ secrets.RPA_API_KEY }}
          PYTHONPATH: src
        run: |
          pip install -q -r requirements-coleta.txt
          set +e
          python -m pf_rpa.coletor
          codigo=$?
          if [ "$codigo" -eq 1 ]; then echo "::warning::Envio falhou; lotes pendentes serão recuperados do artefato na próxima execução. A lacuna aparece na cobertura do boletim."; fi
          exit $codigo
      - name: Guardar logs da coleta como evidência
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpa-coleta-${{ github.run_id }}
          path: |
            rpa/logs/
            rpa/saida/pendentes/
          retention-days: 7
          if-no-files-found: ignore
