# CI do monorepo: testes de todos os módulos + segurança (Gitleaks, Semgrep, Trivy).
# O Render só faz deploy quando TODOS estes checks passam (render.yaml: autoDeployTrigger: checksPass).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --redact --verbose --exit-code 1

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 \
            semgrep scan --config p/default --config p/owasp-top-ten --error \
            --exclude '.worktrees' --exclude 'genai/notebooks' --metrics off

  python:
    name: Testes Python (GenAI e RPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rpa/requirements.txt
            genai/requirements-ci.txt
      - name: RPA
        working-directory: rpa
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - name: GenAI (testes que não precisam do Ollama)
        working-directory: genai
        run: |
          pip install -r requirements-ci.txt
          python -m pytest -q tests

  integracao:
    name: Ferramentas de integracao (SPTrans e ambiente)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q tests/integracao

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias do teste RPA contra o Spring real
        run: pip install -r rpa/requirements.txt
      - name: Testes (PostgreSQL embutido)
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -f backend/pom.xml -B -q \
            -Dpf.integration.root="$PWD" -Dpf.integration.python=python verify
      - name: Evidencias dos testes Java
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-backend
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (Angular + acessibilidade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Testes unitários e de acessibilidade (axe)
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build de produção
        working-directory: frontend
        run: npm run build -- --configuration production

  imagem:
    name: Imagem Docker + Trivy
    runs-on: ubuntu-latest
    needs: [backend, frontend, integracao]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pontofalante:ci .
      - name: Trivy (dependências e configuração do repositório)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.67.2 fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs /repo/.worktrees /repo
      - name: Trivy (imagem)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pontofalante:ci
      - name: Fumaça da imagem (sobe com PostgreSQL e checa /actuator/health e /api/status)
        run: |
          set -euo pipefail
          docker network create pf
          docker run -d --name db --network pf -e POSTGRES_DB=pf -e POSTGRES_USER=pf -e POSTGRES_PASSWORD=pf postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U pf && break; sleep 2; done
          docker exec db pg_isready -U pf
          docker run -d --name app --network pf -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pf -e SPRING_DATASOURCE_USERNAME=pf \
            -e SPRING_DATASOURCE_PASSWORD=pf -e PF_SALT=ci-salt -e RPA_API_KEY=ci-key --memory=512m pontofalante:ci
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health && break; sleep 3; done
          python scripts/integracao/testar_mvp.py --url http://127.0.0.1:8080
      - name: Logs em caso de falha
        if: failure()
        run: docker logs app || true
