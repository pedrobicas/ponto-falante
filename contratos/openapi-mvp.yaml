openapi: 3.0.3
info:
  title: Ponto Falante · API pública do MVP (Spring Boot)
  version: "1.0.0"
  description: |
    Única API que o Angular consome. Todas as rotas ficam sob /api. O Angular compilado é
    servido pelo próprio Spring Boot (mesma origem, sem CORS).

    Regras de honestidade dos dados (valem para toda resposta):
    - `fonte` diz de onde veio o dado: OLHO_VIVO (API real da SPTrans) ou SIMULADO (modo demonstrativo).
    - `tipo` = PREVISAO para horários estimados pela SPTrans. Uma previsão NUNCA é apresentada
      como chegada. Passagens registradas no histórico têm `tipo_registro`.
    - Modo demonstrativo: ligado quando não há SPTRANS_TOKEN ou quando o cliente pede `modo=demo`.
      Toda tela que mostra dado SIMULADO exibe o selo "Dados de demonstração".

    Segredos (variáveis de ambiente, nunca no código): SPTRANS_TOKEN, GENAI_URL, GENAI_API_KEY,
    RPA_API_KEY, VISAO_API_KEY, DISPOSITIVO_API_KEY, DADOS_API_KEY, DATABASE_URL.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento

tags:
  - name: transporte
  - name: assistente
  - name: rpa
  - name: embarque
    description: Embarque assistido (favoritos, acompanhamento com avisos por voz e conferência do letreiro)
  - name: integracoes
  - name: sistema

paths:
  /api/status:
    get:
      tags: [sistema]
      summary: Estado dos serviços para a tela (SPTrans real ou demo, assistente on/off)
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
          description: ok

  /api/pontos:
    get:
      tags: [transporte]
      summary: Busca pontos de ônibus por nome, endereço ou código
      description: >
        No modo real a busca usa o cadastro oficial da SPTrans (GTFS), porque a busca de paradas da Olho Vivo só
        enxerga cerca de 360 paradas com nome. Aceita abreviações, falta de acento e erros simples de digitação;
        o número do endereço ordena pelos pontos de numeração mais próxima. Um código devolve só o ponto do código.
        No máximo 20 resultados.
      parameters:
        - {name: busca, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 80}}
        - {name: modo, in: query, required: false, schema: {type: string, enum: [auto, demo], default: auto}}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [fonte, pontos]
                properties:
                  fonte: {$ref: '#/components/schemas/Fonte'}
                  pontos: {type: array, items: {$ref: '#/components/schemas/Ponto'}}
                  aviso: {type: string, nullable: true, description: "Explicação curta para o passageiro (busca aproximada, código inexistente)"}
          description: Lista (pode ser vazia)
        "400": {description: Busca vazia ou curta demais, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}
        "503": {description: SPTrans indisponível e modo demo não pedido, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}

  /api/pontos/proximos:
    post:
      tags: [transporte]
      summary: Pontos perto de uma coordenada, do mais próximo ao mais distante
      description: A localização vai no corpo para não ficar em URL nem em log de acesso; nada é gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: {type: number}
                lon: {type: number}
                raio: {type: integer, minimum: 100, maximum: 1500, default: 400, description: metros}
                modo: {type: string, enum: [auto, demo]}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [fonte, pontos]
                properties:
                  fonte: {$ref: '#/components/schemas/Fonte'}
                  pontos: {type: array, items: {$ref: '#/components/schemas/Ponto'}}
                  aviso: {type: string, nullable: true}
          description: Lista com distancia_metros (vazia, com aviso, fora da área ou no modo demonstração)
        "400": {description: Localização inválida, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}

  /api/pontos/{codigo}/linhas:
    get:
      tags: [transporte]
      summary: Linhas que param no ponto, com sentido e destino (cadastro GTFS)
      parameters:
        - {name: codigo, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: "fonte, codigo, linhas[{letreiro, sentido, destino, nome_linha}] e aviso"}

  /api/linhas/{letreiro}/paradas:
    get:
      tags: [transporte]
      summary: Paradas da linha, em ordem, nos dois sentidos (cadastro GTFS)
      parameters:
        - {name: letreiro, in: path, required: true, schema: {type: string, example: "875A-10"}}
      responses:
        "200": {description: "fonte, letreiro, sentidos[{letreiro, sentido, destino, nome_linha, paradas[Ponto]}]"}
        "404": {description: Linha fora do cadastro ou número com mais de uma linha, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}

  /api/pontos/{codigo}/previsoes:
    get:
      tags: [transporte]
      summary: Próximos ônibus previstos para um ponto
      parameters:
        - {name: codigo, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: modo, in: query, required: false, schema: {type: string, enum: [auto, demo], default: auto}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrevisoesPonto'}
          description: Previsões ordenadas por minutos
        "404": {description: Ponto inexistente, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}
        "503": {description: SPTrans indisponível, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}

  /api/linhas:
    get:
      tags: [transporte]
      summary: Busca linhas por número, nome ou destino
      description: Número consulta a Olho Vivo; nome ou destino usa o cadastro GTFS (codigo vem nulo nesse caso).
      parameters:
        - {name: busca, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
        - {name: modo, in: query, required: false, schema: {type: string, enum: [auto, demo], default: auto}}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [fonte, linhas]
                properties:
                  fonte: {$ref: '#/components/schemas/Fonte'}
                  linhas: {type: array, items: {$ref: '#/components/schemas/Linha'}}
          description: ok

  /api/chat:
    post:
      tags: [assistente]
      summary: Pergunta ao assistente (o Spring repassa ao serviço GenAI com X-API-Key e timeout)
      description: |
        Se o serviço GenAI estiver fora (PC desligado, túnel caído, timeout), responde 200 com
        `disponivel=false` e uma mensagem amigável. Nunca 500 para o passageiro.
        A pergunta não é gravada em banco nem em log (LGPD).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PerguntaChat'}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaChat'}
          description: Resposta, recusa ou indisponibilidade
        "400": {description: Pergunta vazia ou com mais de 500 caracteres, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}
        "429": {description: Muitas perguntas seguidas do mesmo cliente}

  /api/genai/endereco:
    put:
      tags: [assistente]
      summary: O PC da GenAI informa o endereço atual do túnel (Quick Tunnel muda a cada reinício)
      description: |
        Aceita só HTTPS em `*.trycloudflare.com` ou no host já configurado em GENAI_URL, sem caminho,
        usuário nem parâmetros. Antes de trocar, o backend confere `{url}/health`; se falhar, mantém o
        endereço anterior. Registro só em memória (o script do PC renova a cada 10 minutos).
      parameters:
        - {name: X-API-Key, in: header, required: true, schema: {type: string}, description: GENAI_API_KEY}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, example: "https://exemplo-de-tunel.trycloudflare.com"}
      responses:
        "200": {description: Endereço trocado}
        "400": {description: Endereço fora da regra, content: {application/json: {schema: {$ref: '#/components/schemas/Erro'}}}}
        "401": {description: Chave ausente ou inválida}
        "422": {description: "/health não respondeu pelo endereço informado; endereço anterior mantido"}
        "429": {description: Tentativas seguidas em menos de 5 segundos}
        "503": {description: GENAI_API_KEY não configurada no servidor}

  /api/historico:
    get:
      tags: [rpa]
      summary: Passagens registradas no dia (consumido pelo robô RPA e pelo Big Data)
      parameters:
        - {name: data, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Passagem'}}
          description: Lista no formato do contrato openapi-integracao.yaml (campos em snake_case)

  /api/rpa/amostras:
    get:
      tags: [rpa]
      summary: Amostras REAIS de previsão gravadas pelo coletor do robô num dia (consumido pelo boletim)
      description: |
        Uma amostra = uma consulta do coletor a um ponto monitorado (o que a SPTrans previa naquele instante).
        Previsão não é chegada nem atraso. Público, como /api/historico; veículo anonimizado. Até 2000 por dia.
      parameters:
        - {name: data, in: query, required: true, schema: {type: string, format: date}, description: "Data em São Paulo"}
      responses:
        "200":
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AmostraPrevisao'}}
          description: Amostras ordenadas por consultado_em
        "400": {description: Data fora do intervalo aceito}
    post:
      tags: [rpa]
      summary: Coletor do robô envia amostras reais de previsão (idempotente por ponto + consultado_em)
      description: |
        Cada amostra é avaliada sozinha: as válidas são gravadas, as outras voltam em `rejeitadas` com o motivo
        (fonte_simulada, fonte_desconhecida, ponto_invalido, consultado_em_invalido, fora_da_janela,
        horario_referencia_invalido, onibus_invalido, formato_invalido). Só aceita fonte OLHO_VIVO/olhovivo;
        consultado_em nas últimas 48 h e no máximo 5 min no futuro. Chave conferida antes de ler o corpo.
      parameters:
        - {name: X-API-Key, in: header, required: true, schema: {type: string}, description: RPA_API_KEY}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvioAmostras'}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultadoEnvioAmostras'}
          description: Resultado por amostra
        "400": {description: Corpo sem lista amostras, lista vazia ou com mais de 60 itens, execucao_id inválido}
        "401": {description: Chave ausente ou inválida}
        "503": {description: RPA_API_KEY não configurada no servidor}

  /api/boletim:
    get:
      tags: [rpa]
      summary: Último boletim publicado pelo robô
      responses:
        "200": {description: "Conteúdo do boletim (schema Boletim abaixo e em openapi-integracao.yaml) + recebido_em", content: {application/json: {schema: {$ref: '#/components/schemas/Boletim'}}}}
        "404": {description: Nenhum boletim ainda}
    post:
      tags: [rpa]
      summary: Robô publica o boletim do dia (upsert por data_referencia)
      parameters:
        - {name: X-API-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Boletim'}
      responses:
        "201": {description: Gravado}
        "400": {description: "JSON inválido, campos obrigatórios ausentes ou proveniência incoerente (dados_simulados x fonte_dados, natureza_dados x fonte_dados, linhas[].classificacao, linha ESTIMADO com atraso_medio_min)"}
        "401": {description: Chave ausente ou inválida}

  /api/boletim/{data}:
    get:
      tags: [rpa]
      summary: Boletim de uma data
      parameters:
        - {name: data, in: path, required: true, schema: {type: string, format: date}}
      responses:
        "200": {description: Boletim}
        "404": {description: Não há boletim para a data}

  /api/boletins:
    get:
      tags: [rpa]
      summary: Lista resumida dos últimos 30 boletins (data, desatualizado, contagem por status)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    data_referencia: {type: string, format: date}
                    desatualizado: {type: boolean}
                    dados_simulados: {type: boolean}
                    criticas: {type: integer}
                    atencao: {type: integer}
                    recebido_em: {type: string, format: date-time}
                    natureza_dados: {type: string, nullable: true, enum: [ESTIMADO, SIMULADO, INDISPONIVEL], description: "NOVO; null em boletins antigos"}
          description: ok

  # ---------- Contratos para as outras disciplinas ----------
  /api/embarque/favoritos:
    get:
      tags: [embarque]
      summary: Trajetos favoritos do aparelho (ponto + linha + sentido + apelido)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      responses:
        "200":
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TrajetoFavorito'}}}}
          description: ok
    post:
      tags: [embarque]
      summary: Salva um trajeto (idempotente; o mesmo trajeto só atualiza o apelido). Máximo de 30 por aparelho.
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NovoTrajeto'}}}
      responses:
        "200":
          content: {application/json: {schema: {$ref: '#/components/schemas/TrajetoFavorito'}}}
          description: salvo
        "400": {description: "DADOS_INVALIDOS ou DISPOSITIVO_INVALIDO"}
        "409": {description: LIMITE_FAVORITOS}
        "429": {description: MUITAS_ACOES}
  /api/embarque/favoritos/{id}:
    patch:
      tags: [embarque]
      summary: Renomeia o trajeto (apelido de até 40 caracteres; marcação HTML é removida)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}, {name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {apelido: {type: string, maxLength: 40, nullable: true}}}}}
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/TrajetoFavorito'}}}, description: ok}
        "404": {description: Não é um trajeto deste aparelho}
    delete:
      tags: [embarque]
      summary: Remove o trajeto
      parameters: [{$ref: '#/components/parameters/Dispositivo'}, {name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        "204": {description: removido}
        "404": {description: Não é um trajeto deste aparelho}
  /api/embarque/sessoes:
    post:
      tags: [embarque]
      summary: Começa a acompanhar até 3 linhas em um ponto (encerra como SUBSTITUIDA o acompanhamento anterior do aparelho)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NovaSessao'}}}
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/SessaoEmbarque'}}}, description: iniciada}
        "422": {description: "LINHA_NAO_PARA_NO_PONTO: o cadastro oficial (GTFS) mostra que a linha não para neste ponto"}
  /api/embarque/sessoes/atual:
    get:
      tags: [embarque]
      summary: Acompanhamento em andamento do aparelho (para retomar depois de recarregar a página)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/SessaoEmbarque'}}}, description: ok}
        "204": {description: Nenhum acompanhamento aberto}
  /api/embarque/sessoes/{id}/situacao:
    get:
      tags: [embarque]
      summary: Previsões da SPTrans filtradas pelas linhas e sentidos escolhidos (o app consulta a cada 20 s)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/SituacaoEmbarque'}}}, description: ok}
        "409": {description: "ACOMPANHAMENTO_ENCERRADO (encerrado ou expirado após 3 h)"}
        "503": {description: SPTrans indisponível; a falha é contada e o app avisa depois de 2 seguidas}
  /api/embarque/sessoes/{id}/encerrar:
    post:
      tags: [embarque]
      summary: Encerra o acompanhamento com o desfecho informado pela pessoa
      parameters: [{$ref: '#/components/parameters/Dispositivo'}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [desfecho], properties: {desfecho: {type: string, enum: [EMBARQUEI, DESISTI]}}}}}
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/SessaoEmbarque'}}}, description: encerrado}
  /api/embarque/dados:
    delete:
      tags: [embarque]
      summary: Apaga favoritos, acompanhamentos e conferências deste aparelho
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      responses:
        "204": {description: apagado}
  /api/embarque/indicadores:
    get:
      tags: [embarque]
      summary: Indicadores de impacto dos últimos 30 dias (somente acompanhamentos com dados reais)
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/IndicadoresEmbarque'}}}, description: ok}
  /api/embarque/visao:
    get:
      tags: [embarque]
      summary: Diz se a conferência do letreiro pela câmera está conectada a um modelo
      responses:
        "200":
          content: {application/json: {schema: {type: object, properties: {conectada: {type: boolean}, mensagem: {type: string}}}}}
          description: ok
  /api/embarque/visao/conferir:
    post:
      tags: [embarque]
      summary: Confere a foto do letreiro com a linha esperada (ver openapi-visao-letreiro.yaml)
      parameters: [{$ref: '#/components/parameters/Dispositivo'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem, linha_esperada]
              properties:
                imagem: {type: string, format: binary, description: JPEG ou PNG até 2 MB; não é gravada}
                linha_esperada: {type: string, example: 875A-10}
                sessao: {type: string, format: uuid, nullable: true}
      responses:
        "200": {content: {application/json: {schema: {$ref: '#/components/schemas/ConferenciaLetreiro'}}}, description: ok}
        "413": {description: ARQUIVO_GRANDE}
        "415": {description: IMAGEM_INVALIDA}
        "429": {description: MUITAS_ACOES}
        "502": {description: VISAO_RESPOSTA_INVALIDA (o modelo respondeu fora do contrato)}
        "503": {description: "VISAO_NAO_CONECTADA ou VISAO_INDISPONIVEL"}

  /api/integracoes/visao/deteccoes:
    post:
      tags: [integracoes]
      summary: Visão computacional informa a linha reconhecida no letreiro de um ônibus chegando
      parameters:
        - {name: X-API-Key, in: header, required: true, schema: {type: string}, description: VISAO_API_KEY}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeteccaoVisao'}
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  frase_falada: {type: string, example: "Ônibus 8000-10, Lapa, chegando."}
          description: Aceito; a frase pode ser lida pelo totem/app
        "400": {description: Payload inválido}
        "401": {description: Chave inválida}
    get:
      tags: [integracoes]
      summary: Últimas 50 detecções de um ponto
      parameters:
        - {name: ponto, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeteccaoVisao'}}
          description: ok

  /api/integracoes/dispositivos/eventos:
    post:
      tags: [integracoes]
      summary: ESP32 do ponto envia evento (botão pressionado pelo passageiro ou heartbeat)
      description: Em BOTAO_PRESSIONADO, a resposta traz a frase com os próximos ônibus para o totem falar.
      parameters:
        - {name: X-Device-Key, in: header, required: true, schema: {type: string}, description: DISPOSITIVO_API_KEY}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventoDispositivo'}
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  frase_falada: {type: string, nullable: true}
                  fonte: {$ref: '#/components/schemas/Fonte'}
          description: Aceito
        "400": {description: Payload inválido}
        "401": {description: Chave inválida}

  /api/integracoes/dados/passagens:
    get:
      tags: [integracoes]
      summary: Exportação para Big Data (CSV), período de no máximo 31 dias
      parameters:
        - {name: X-API-Key, in: header, required: true, schema: {type: string}, description: DADOS_API_KEY}
        - {name: de, in: query, required: true, schema: {type: string, format: date}}
        - {name: ate, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          content:
            text/csv:
              schema: {type: string, example: "data,ponto,linha,sentido,veiculo,programado_em,previsto_em,acessivel,fonte,tipo_registro"}
          description: CSV com cabeçalho; veículo já anonimizado
        "400": {description: Período inválido}
        "401": {description: Chave inválida}

components:
  schemas:
    Fonte: {type: string, enum: [OLHO_VIVO, GTFS_SPTRANS, SIMULADO], description: "OLHO_VIVO: tempo real; GTFS_SPTRANS: cadastro oficial de paradas e itinerários; SIMULADO: demonstração"}

    Erro:
      type: object
      required: [mensagem]
      properties:
        mensagem: {type: string, description: "Frase simples para a pessoa"}
        codigo: {type: string}

    Status:
      type: object
      properties:
        versao: {type: string}
        sptrans: {type: string, enum: [REAL, DEMO, INDISPONIVEL], description: "REAL = token configurado e autenticado"}
        assistente: {type: string, enum: [DISPONIVEL, INDISPONIVEL]}
        ultimo_boletim: {type: string, format: date, nullable: true}
        horario_servidor: {type: string, format: date-time}
        assistente_tempo_real: {type: boolean, description: "true = o assistente responde horários/linhas pelo backend mesmo com a GenAI fora"}
        visao: {type: string, enum: [CONECTADA, NAO_CONECTADA], description: "Conferência do letreiro pela câmera (PF_VISAO_URL configurado)"}

    Ponto:
      type: object
      required: [codigo, nome, fonte]
      properties:
        codigo: {type: integer, format: int64}
        nome: {type: string}
        endereco: {type: string, nullable: true}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
        fonte: {$ref: '#/components/schemas/Fonte'}
        linhas: {type: array, nullable: true, items: {type: string}, description: "Letreiros que param no ponto (cadastro)"}
        distancia_metros: {type: integer, nullable: true, description: "Só em buscas por proximidade"}

    Linha:
      type: object
      properties:
        codigo: {type: integer, format: int64, description: "código interno da SPTrans (cl)"}
        letreiro: {type: string, example: "8000-10"}
        sentido: {type: integer, enum: [1, 2]}
        terminal_principal: {type: string}
        terminal_secundario: {type: string}
        destino: {type: string}
        circular: {type: boolean}

    OnibusPrevisto:
      type: object
      required: [letreiro, destino, previsto_em, minutos, acessivel]
      properties:
        letreiro: {type: string, example: "8000-10"}
        destino: {type: string}
        sentido: {type: integer}
        previsto_em: {type: string, pattern: '^\d{2}:\d{2}$', description: "horário PREVISTO pela SPTrans"}
        minutos: {type: integer, description: "minutos até a previsão (0 = chegando)"}
        acessivel: {type: boolean}
        veiculo: {type: string, description: "hash curto do prefixo; nunca o prefixo bruto"}

    PrevisoesPonto:
      type: object
      required: [ponto, fonte, tipo, consultado_em, onibus, frase_falada]
      properties:
        ponto: {$ref: '#/components/schemas/Ponto'}
        fonte: {$ref: '#/components/schemas/Fonte'}
        tipo: {type: string, enum: [PREVISAO]}
        horario_referencia: {type: string, description: "hora da SPTrans (hr) ou do simulador"}
        consultado_em: {type: string, format: date-time}
        onibus: {type: array, items: {$ref: '#/components/schemas/OnibusPrevisto'}}
        frase_falada: {type: string, example: "Ponto Paulista. Ônibus 8000-10, Lapa, previsto em 3 minutos, acessível."}

    PerguntaChat:
      type: object
      required: [pergunta]
      properties:
        pergunta: {type: string, minLength: 1, maxLength: 500}
        contexto: {$ref: '#/components/schemas/ContextoChat'}

    ContextoChat:
      type: object
      description: Entidades da conversa; não guarda previsões. Enviado novamente a cada mensagem.
      properties:
        ponto: {type: integer, format: int64, minimum: 1, maximum: 999999999999, nullable: true}
        linha: {type: string, pattern: '^[0-9]{3,4}[A-Za-z]?(-[0-9]{1,2})?$', nullable: true}
        sentido: {type: integer, enum: [1, 2], nullable: true}
        pendencia: {type: string, enum: [PONTO_PREVISAO, PONTO_LINHAS, PONTO_EMBARQUE, LINHA, PONTO], nullable: true}
        veiculo_anterior: {type: string, pattern: '^[a-f0-9]{10}$', nullable: true, description: 'Hash salgado do ônibus de referência, usado apenas para consultar o seguinte em uma nova previsão. Sem horário ou prefixo bruto.'}
        tema: {type: string, enum: [BILHETE, GRATUIDADE, ACESSIBILIDADE], nullable: true}
        publico: {type: string, enum: [IDOSO, PCD, ESTUDANTE], nullable: true}
        idade: {type: integer, minimum: 0, maximum: 120, nullable: true}

    RespostaChat:
      type: object
      required: [resposta, fontes, confianca, nao_consta, disponivel]
      properties:
        resposta: {type: string}
        fontes:
          type: array
          items:
            type: object
            properties:
              documento: {type: string}
              trecho_id: {type: string}
              url: {type: string, format: uri, nullable: true}
        confianca: {type: string, enum: [alta, media, baixa]}
        nao_consta: {type: boolean}
        disponivel: {type: boolean, description: "false = serviço GenAI fora do ar; resposta é aviso"}
        latencia_ms: {type: integer}
        natureza_dados: {type: string, nullable: true, enum: [ESTIMADO, SIMULADO, INDISPONIVEL], description: "Classificação do boletim quando origem=BOLETIM; null quando não informada. Não confundir disponibilidade do serviço com suficiência dos dados."}
        origem:
          type: string
          enum: [TEMPO_REAL, CADASTRO, BOLETIM, BASE_OFICIAL, FORA_DA_AREA, INDISPONIVEL]
          description: "TEMPO_REAL = backend consultou a SPTrans (ou a demonstração, identificada no texto), sem LLM; BASE_OFICIAL = GenAI local com fontes oficiais; FORA_DA_AREA = pergunta sobre outra cidade, respondida pelo backend com a limitação de área"
        tipo_resposta:
          type: string
          enum: [FUNDAMENTADA, CONSULTA, RECUSA, FORA_DA_AREA, INSUFICIENTE, INDISPONIVEL]
          description: "Calculado pelo backend a partir de origem, nao_consta, fontes e confianca. A interface mostra a situação por este campo, e não a confiança crua: uma recusa nunca aparece como confiança alta."
        contexto: {$ref: '#/components/schemas/ContextoChat'}
        acoes:
          type: array
          items:
            type: object
            properties:
              titulo: {type: string}
              pergunta: {type: string, nullable: true}
              rota: {type: string, nullable: true}

    Passagem:
      type: object
      description: Igual ao schema Passagem de openapi-integracao.yaml, mais tipo_registro
      properties:
        ponto: {type: string}
        linha: {type: string}
        sentido: {type: string}
        veiculo: {type: string}
        programado_em: {type: string}
        previsto_em: {type: string}
        acessivel: {type: boolean}
        fonte: {type: string, enum: [olhovivo, simulador]}
        tipo_registro: {type: string, enum: [SIMULADA, INFERIDA_DA_PREVISAO], description: "INFERIDA = veículo com previsão de 0-1 min que sumiu da previsão seguinte; não é chegada medida por sensor"}
        atualizado_em: {type: string, format: date-time}

    OnibusAmostra:
      type: object
      required: [linha, previsto_em, minutos]
      properties:
        linha: {type: string, example: "8700-10", description: "letreiro da SPTrans (no envio também aceito como letreiro)"}
        sentido: {oneOf: [{type: integer}, {type: string}]}
        destino: {type: string}
        previsto_em: {type: string, pattern: '^\d{2}:\d{2}$', description: "horário PREVISTO pela SPTrans; não é chegada"}
        minutos: {type: integer, minimum: 0, maximum: 240}
        acessivel: {type: boolean}
        veiculo: {type: string, description: hash do prefixo (anonimizado)}

    AmostraPrevisao:
      type: object
      properties:
        ponto: {type: string, example: "260015039"}
        consultado_em: {type: string, format: date-time, description: "instante da consulta à SPTrans (segundos, fuso de São Paulo)"}
        horario_referencia: {type: string, nullable: true, example: "10:00"}
        fonte: {type: string, enum: [olhovivo]}
        tipo_registro: {type: string, enum: [AMOSTRA_PREVISAO]}
        total_onibus: {type: integer}
        onibus: {type: array, items: {$ref: '#/components/schemas/OnibusAmostra'}}

    EnvioAmostras:
      type: object
      required: [amostras]
      properties:
        execucao_id: {type: string, maxLength: 64, example: "coleta-20261112T070001"}
        amostras:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: object
            required: [ponto, consultado_em, fonte, onibus]
            properties:
              ponto: {oneOf: [{type: string}, {type: integer}]}
              consultado_em: {type: string, format: date-time}
              horario_referencia: {type: string, nullable: true}
              fonte: {type: string, enum: [OLHO_VIVO, olhovivo]}
              tipo: {type: string, enum: [PREVISAO]}
              onibus: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/OnibusAmostra'}}

    ResultadoEnvioAmostras:
      type: object
      properties:
        recebidas: {type: integer}
        gravadas: {type: integer}
        duplicadas: {type: integer}
        rejeitadas:
          type: array
          items:
            type: object
            properties:
              indice: {type: integer}
              motivo: {type: string}

    LinhaBoletim:
      type: object
      required: [linha, status, frase]
      properties:
        linha: {type: string}
        status: {type: string, enum: [CRITICA, ATENCAO, OK, SEM_DADOS]}
        rotulo: {type: string, description: "ESTIMADO: 'Espera longa (estimada)', 'Espera acima do normal (estimada)', 'Espera normal (estimada)'; SIMULADO: '... (simulado)'"}
        classificacao: {type: string, nullable: true, enum: [ESTIMADO, SIMULADO, INDISPONIVEL], description: "NOVO. INDISPONIVEL sempre com status SEM_DADOS"}
        atraso_medio_min: {type: number, nullable: true, description: "Só no SIMULADO. Sempre null no ESTIMADO: previsão não mede atraso"}
        intervalo_max_min: {type: integer, nullable: true, description: "ESTIMADO: igual a maior_espera_prevista_min"}
        espera_tipica_min: {type: number, nullable: true, description: "NOVO (ESTIMADO): mediana da maior espera prevista por consulta"}
        maior_espera_prevista_min: {type: integer, nullable: true, description: "NOVO (ESTIMADO)"}
        proximo_onibus_mediana_min: {type: number, nullable: true, description: "NOVO (ESTIMADO): mediana dos minutos até o próximo ônibus"}
        sem_previsao_pct: {type: number, nullable: true, description: "NOVO (ESTIMADO): % das consultas sem ônibus da linha previsto"}
        amostras: {type: integer, description: "NOVO (ESTIMADO): consultas nos pontos onde a linha apareceu"}
        amostras_com_previsao: {type: integer, description: "NOVO (ESTIMADO)"}
        pontos: {type: array, items: {type: string}, description: "NOVO (ESTIMADO)"}
        passagens: {type: integer, description: "Só no SIMULADO"}
        acessiveis_pct: {type: number, nullable: true}
        fontes: {type: array, items: {type: string, enum: [olhovivo, simulador]}}
        motivo: {type: string}
        frase: {type: string, description: frase pronta para leitura em voz}

    Boletim:
      type: object
      required: [data_referencia, gerado_em, desatualizado, linhas, resumo_falado, dados_simulados, fonte_dados]
      description: |
        natureza_dados (NOVO) diz o que o boletim é, sem misturar categorias:
        ESTIMADO = calculado de amostras REAIS de previsão da SPTrans (espera prevista, nunca atraso);
        SIMULADO = histórico de demonstração (só com o MVP em modo demonstração e sem amostra real);
        INDISPONIVEL = sem dados suficientes para classificar a operação, mesmo quando houve consultas reais.
        O bloco amostragem traz os fatos VERIFICADOS da coleta, que não comprovam chegadas nem atrasos.
        Ausente em boletins antigos. O backend rejeita combinações incoerentes.
      properties:
        data_referencia: {type: string, format: date}
        gerado_em: {type: string, format: date-time}
        desatualizado: {type: boolean}
        motivo_desatualizado: {type: string, nullable: true}
        marcado_desatualizado_em: {type: string, format: date-time}
        natureza_dados: {type: string, nullable: true, enum: [ESTIMADO, SIMULADO, INDISPONIVEL]}
        metodo: {type: string, nullable: true, description: "NOVO: explicação curta do método, pronta para exibir"}
        periodo_referencia:
          type: object
          description: NOVO
          properties:
            data: {type: string, format: date}
            inicio: {type: string, nullable: true, example: "07:00", description: "primeira consulta (ESTIMADO)"}
            fim: {type: string, nullable: true, example: "21:00", description: "última consulta (ESTIMADO)"}
            fuso: {type: string, example: America/Sao_Paulo}
        ultima_atualizacao: {type: string, format: date-time, nullable: true, description: "NOVO: última consulta real (ESTIMADO) ou geração"}
        fonte_dados:
          type: object
          description: "Contagem por origem. ESTIMADO: consultas reais válidas; SIMULADO: registros simulados"
          properties:
            olhovivo: {type: integer}
            simulador: {type: integer}
        dados_simulados: {type: boolean}
        rede: {type: string, nullable: true, enum: [sptrans_olhovivo, gtfs_sptrans, rede_ficticia]}
        amostragem:
          type: object
          description: "NOVO (ESTIMADO): fatos VERIFICADOS da coleta"
          properties:
            classificacao: {type: string, enum: [VERIFICADO]}
            descricao: {type: string}
            pontos_monitorados: {type: array, items: {type: string}}
            pontos_com_amostra: {type: array, items: {type: string}}
            consultas_validas: {type: integer}
            consultas_esperadas: {type: integer, nullable: true}
            cobertura_pct: {type: number, nullable: true}
            primeira_consulta: {type: string, format: date-time}
            ultima_consulta: {type: string, format: date-time}
            onibus_previstos: {type: integer}
        parametros: {type: object, additionalProperties: {type: number}}
        estatisticas: {type: object, additionalProperties: {type: integer}, description: "recebidos, validos, invalidos, duplicados, fora_escopo; ESTIMADO também fora_periodo, onibus_descartados, linhas_avaliadas, linhas_poucas_amostras"}
        invalidos_por_motivo: {type: object, additionalProperties: {type: integer}}
        linhas: {type: array, items: {$ref: '#/components/schemas/LinhaBoletim'}}
        avisos: {type: array, items: {type: string}}
        resumo_falado: {type: string}
        html: {type: string, description: "fragmento HTML acessível (já escapado); o Angular não usa com innerHTML"}
        revisao_humana: {type: string}
        recebido_em: {type: string, format: date-time, description: "só no GET"}

    DeteccaoVisao:
      type: object
      required: [ponto, linha_reconhecida, confianca, capturado_em, dispositivo]
      properties:
        ponto: {type: integer, format: int64}
        linha_reconhecida: {type: string, maxLength: 20, example: "8000-10"}
        confianca: {type: number, minimum: 0, maximum: 1}
        capturado_em: {type: string, format: date-time}
        dispositivo: {type: string, maxLength: 64}

    EventoDispositivo:
      type: object
      required: [dispositivo_id, ponto, tipo, ocorrido_em]
      properties:
        dispositivo_id: {type: string, maxLength: 64, example: "esp32-ponto-0042"}
        ponto: {type: integer, format: int64}
        tipo: {type: string, enum: [BOTAO_PRESSIONADO, HEARTBEAT]}
        ocorrido_em: {type: string, format: date-time}
        bateria_pct: {type: integer, minimum: 0, maximum: 100, nullable: true}

    LinhaEscolhida:
      type: object
      required: [letreiro]
      properties:
        letreiro: {type: string, pattern: '^[0-9A-Za-z]{2,6}(-[0-9]{1,2})?$', example: 8000-10}
        sentido: {type: integer, enum: [1, 2], nullable: true, description: "1 ou 2 (SPTrans); null = qualquer sentido"}
        destino: {type: string, nullable: true}
    NovoTrajeto:
      type: object
      required: [ponto, ponto_nome, linha]
      properties:
        ponto: {type: integer, format: int64}
        ponto_nome: {type: string, maxLength: 120}
        linha: {type: string, example: 8000-10}
        sentido: {type: integer, enum: [1, 2], nullable: true}
        destino: {type: string, nullable: true}
        apelido: {type: string, maxLength: 40, nullable: true, example: Trabalho}
        modo: {type: string, enum: [auto, demo]}
    TrajetoFavorito:
      allOf:
        - $ref: '#/components/schemas/NovoTrajeto'
        - type: object
          properties:
            id: {type: integer, format: int64}
            simulado: {type: boolean}
            criado_em: {type: string, format: date-time}
    NovaSessao:
      type: object
      required: [ponto, linhas]
      properties:
        ponto: {type: integer, format: int64}
        ponto_nome: {type: string, maxLength: 120}
        linhas: {type: array, minItems: 1, maxItems: 3, items: {$ref: '#/components/schemas/LinhaEscolhida'}}
        modo: {type: string, enum: [auto, demo]}
    SessaoEmbarque:
      type: object
      properties:
        id: {type: string, format: uuid}
        ponto: {type: integer, format: int64}
        ponto_nome: {type: string}
        linhas: {type: array, items: {$ref: '#/components/schemas/LinhaEscolhida'}}
        simulado: {type: boolean}
        iniciada_em: {type: string, format: date-time}
        encerrada_em: {type: string, format: date-time, nullable: true}
        desfecho: {type: string, enum: [EMBARQUEI, DESISTI, SUBSTITUIDA, EXPIRADA], nullable: true}
    SituacaoEmbarque:
      type: object
      properties:
        sessao: {$ref: '#/components/schemas/SessaoEmbarque'}
        fonte: {type: string, enum: [OLHO_VIVO, SIMULADO]}
        consultado_em: {type: string, format: date-time}
        horario_referencia: {type: string, format: date-time}
        onibus: {type: array, description: Só as linhas e sentidos escolhidos, items: {type: object}}
        proximo: {type: object, nullable: true}
        frase_falada: {type: string}
        outras_linhas_previstas: {type: array, items: {type: string}, description: Outras linhas com previsão no ponto (ajuda a perceber o ponto errado)}
    ConferenciaLetreiro:
      type: object
      properties:
        resultado: {type: string, enum: [CONFERE, NUMERO_CONFERE, NAO_CONFERE, INCONCLUSIVO]}
        linha_esperada: {type: string}
        linha_lida: {type: string, nullable: true}
        confianca: {type: number, nullable: true}
        frase_falada: {type: string, description: Sempre pede para confirmar com o motorista}
        modelo: {type: string}
        latencia_ms: {type: integer, nullable: true}
    IndicadoresEmbarque:
      type: object
      properties:
        acompanhamentos30_dias: {type: integer}
        embarques_confirmados30_dias: {type: integer}
        taxa_confirmacao_pct: {type: number, nullable: true}
        espera_prevista_media_min: {type: number, nullable: true}
        trajetos_favoritos: {type: integer}
        observacao: {type: string}

  parameters:
    Dispositivo:
      name: X-PF-Dispositivo
      in: header
      required: true
      description: Identificador aleatório do aparelho (32 a 64 hexadecimais). O servidor guarda apenas um hash.
      schema: {type: string, pattern: '^[a-f0-9]{32,64}$'}
