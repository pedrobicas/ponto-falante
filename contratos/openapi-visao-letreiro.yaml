openapi: 3.0.3
info:
  title: Ponto Falante · Serviço de leitura de letreiro (visão computacional)
  version: "1.1.0"
  description: |
    Contrato do serviço de visão computacional da equipe (implementado em visao/servico/app.py: YOLO11n treinado +
    EasyOCR) usado pelo Embarque Assistido.
    O backend Spring Boot é o único cliente deste serviço: o aplicativo envia a foto do letreiro para
    `POST /api/embarque/visao/conferir`, o backend repassa a imagem para `POST /v1/letreiro` deste
    serviço e compara o texto lido com a linha que a pessoa está esperando.

    Responsabilidades separadas:
    - Este serviço só LÊ o letreiro: devolve os textos encontrados, com confiança e posição.
    - A decisão "é o seu ônibus / não é / não deu para ler" é do backend (classe ConferenciaLetreiro),
      com confiança mínima de 0,45. O backend envia, opcionalmente, as linhas que param no ponto (`linhas`):
      o serviço só VALIDA uma leitura que case exatamente com uma delas.

    Como conectar (sem mudar código):
    - `PF_VISAO_URL`: endereço base fixo do serviço, por exemplo http://127.0.0.1:8090 (uso local); ou
    - registro pelo PC: `PUT /api/visao/endereco` do backend com `{"url": "https://<nome>.trycloudflare.com"}`,
      depois de o backend conferir `/health` e `/identidade` deste serviço (scripts/visao/iniciar.ps1 -TunelRapido).
    - `PF_VISAO_SERVICO_CHAVE`: chave enviada no cabeçalho X-API-Key (vazia: o backend usa GENAI_API_KEY).
    Sem endereço, `GET /api/status` informa `visao: NAO_CONECTADA`; com endereço mas sem `/health` ok,
    `INDISPONIVEL`. Nos dois casos o aplicativo diz que a conferência não está disponível. Nenhum resultado é
    simulado.

    Limites aplicados pelo backend: imagem JPEG ou PNG de até 2 MB (o aplicativo reduz para no máximo
    1280 px no maior lado); tempo de conexão de 3 s e de resposta de 8 s. Fora disso, a pessoa recebe
    "não foi possível conferir agora; confirme com o motorista".

    Privacidade: o backend não grava a imagem. Guarda apenas o resultado da conferência (linha esperada,
    texto lido, confiança, resultado e nome do modelo). O serviço de visão também não deve guardar as
    imagens recebidas além do tempo da requisição.

    Relação com `/api/integracoes/visao/deteccoes` (openapi-mvp.yaml): aquele endpoint recebe detecções
    enviadas por câmeras fixas (push). Este contrato é a consulta síncrona a partir da câmera do celular.
    Os dois podem usar o mesmo modelo.
servers:
  - url: "{PF_VISAO_URL}"
    variables:
      PF_VISAO_URL:
        default: http://localhost:8090

paths:
  /v1/letreiro:
    post:
      summary: Lê o letreiro de ônibus presente na imagem
      operationId: lerLetreiro
      parameters:
        - name: X-API-Key
          in: header
          required: true
          description: Valor de PF_VISAO_SERVICO_CHAVE configurado no backend.
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary
                  description: Foto JPEG ou PNG, até 2 MB e 4096 px no maior lado.
                linhas:
                  type: string
                  description: |
                    Opcional. Linhas do ponto separadas por vírgula (ex.: "875A-10,875C-10,6450-10"); as que a
                    pessoa espera vêm primeiro. Com a lista, o serviço só valida leitura com casamento exato
                    (tolerando O/0, I/1, S/5, B/8, G/6) e devolve fora da lista como `validada: false`, com a
                    confiança reduzida. Sem a lista, nenhuma leitura é validada.
      responses:
        "200":
          description: |
            Leitura concluída. Uma lista `leituras` vazia é uma resposta válida e significa
            "não encontrei letreiro legível" (o aplicativo responde INCONCLUSIVO).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RespostaLeitura'}
              examples:
                leu:
                  value:
                    modelo: pf-visao 1.0.0 (YOLO11n letreiro + EasyOCR)
                    latencia_ms: 865
                    leituras:
                      - {texto: "647P-10", confianca: 0.811, validada: true, caixa: [164, 267, 342, 79]}
                    deteccoes: {onibus: 1, letreiros: 1}
                    linhas_validadas: true
                so_destino:
                  value: {modelo: pf-visao 1.0.0 (YOLO11n letreiro + EasyOCR), latencia_ms: 875, leituras: [],
                          deteccoes: {onibus: 1, letreiros: 1}, linhas_validadas: true}
        "401": {description: Chave ausente ou inválida.}
        "413": {description: Imagem grande demais.}
        "415": {description: Formato de imagem não suportado.}
        "503": {description: Modelo carregando ou ocupado com outra foto.}
  /health:
    get:
      summary: Estado do modelo (sem chave). 200 só com o modelo carregado.
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              example: {status: ok, modelo: "pf-visao 1.0.0 (YOLO11n letreiro + EasyOCR)", dispositivo: cuda}
        "503": {description: "status: carregando ou erro"}
  /identidade:
    get:
      summary: Prova que o serviço conhece a chave, sem enviá-la (usada antes de aceitar um túnel novo)
      parameters:
        - {name: desafio, in: query, required: true, schema: {type: string, pattern: "^[0-9a-f]{16,128}$"}}
      responses:
        "200":
          description: 'prova = hex(HMAC-SHA256(chave, "pf-visao-identidade:" + desafio))'
          content:
            application/json:
              example: {prova: "15e824b3f92d100986132704c3b77fc10c24f1d93b940d7eb2384f5a1ae11c73"}

components:
  schemas:
    RespostaLeitura:
      type: object
      required: [modelo, leituras]
      properties:
        modelo:
          type: string
          maxLength: 80
          description: Nome e versão do modelo (aparece no resultado e fica registrado). Obrigatório.
        latencia_ms:
          type: integer
          minimum: 0
          description: Tempo de inferência, opcional.
        deteccoes:
          type: object
          description: Opcional. Quantos ônibus e letreiros o detector achou (o backend usa para orientar o enquadramento).
          properties:
            onibus: {type: integer, minimum: 0}
            letreiros: {type: integer, minimum: 0}
        linhas_validadas:
          type: boolean
          description: Opcional. A lista `linhas` foi recebida e usada.
        leituras:
          type: array
          description: Textos de letreiro encontrados. O backend usa a leitura de maior confiança que contenha um número de linha.
          items: {$ref: '#/components/schemas/Leitura'}
    Leitura:
      type: object
      required: [texto, confianca]
      properties:
        texto:
          type: string
          maxLength: 40
          description: |
            Texto lido como aparece no letreiro. O backend extrai o número da linha com a expressão
            N?[0-9]{3,4}[A-Z]? seguida opcionalmente de "-" e da variante (ex.: 875A-10, 8000, N137-11).
        confianca:
          type: number
          minimum: 0
          maximum: 1
        validada:
          type: boolean
          description: Opcional. true = casou exatamente com uma linha de `linhas`.
        caixa:
          type: array
          description: Posição do letreiro na imagem [x, y, largura, altura] em pixels. Opcional.
          minItems: 4
          maxItems: 4
          items: {type: integer}
