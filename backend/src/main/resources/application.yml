server:
  port: ${PORT:8080}
  # IP real do cliente vem do X-Forwarded-For apenas quando a conexão é de proxy confiável
  # (padrão do Tomcat: faixas privadas, como o proxy interno do Render).
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: pontofalante
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pontofalante}
    username: ${SPRING_DATASOURCE_USERNAME:pontofalante}
    password: ${SPRING_DATASOURCE_PASSWORD:pontofalante}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # Só a conferência do letreiro recebe arquivo (um quadro da câmera, nunca gravado).
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    nome: Ponto Falante
    descricao: Backend do MVP (transporte, assistente, RPA e integrações)

pf:
  sptrans-token: ${SPTRANS_TOKEN:}
  sptrans-base-url: ${SPTRANS_BASE_URL:https://api.olhovivo.sptrans.com.br/v2.1}
  # Gateway oficial da Prefeitura (apilib): Consumer Key/Secret da aplicação inscrita na API OlhoVivo v2.1.
  sptrans-gateway-chave: ${SPTRANS_GATEWAY_CHAVE:}
  sptrans-gateway-segredo: ${SPTRANS_GATEWAY_SEGREDO:}
  sptrans-gateway-url: ${SPTRANS_GATEWAY_URL:https://gateway.apilib.prefeitura.sp.gov.br/sptrans/olhovivo/v2.1}
  sptrans-gateway-token-url: ${SPTRANS_GATEWAY_TOKEN_URL:https://gateway.apilib.prefeitura.sp.gov.br/token}
  genai-url: ${GENAI_URL:}
  genai-api-key: ${GENAI_API_KEY:}
  salt: ${PF_SALT:troque-este-sal-em-producao}
  rpa-api-key: ${RPA_API_KEY:}
  visao-api-key: ${VISAO_API_KEY:}
  # Modelo de visão do letreiro (Applied Computer Vision, pasta visao/). Roda no PC da equipe (precisa de ~1,5 GB de
  # RAM, acima do plano gratuito do Render) e se registra por PUT /api/visao/endereco. Sem endereço: a conferência
  # pela câmera responde 503 e a tela diz que não está disponível.
  visao-url: ${PF_VISAO_URL:}
  # Chave entre o backend e o serviço de visão. Sem PF_VISAO_SERVICO_CHAVE, usa a GENAI_API_KEY: os dois serviços
  # rodam no mesmo PC do dono e as provas de identidade usam prefixos diferentes.
  visao-servico-chave: ${PF_VISAO_SERVICO_CHAVE:${GENAI_API_KEY:}}
  dispositivo-api-key: ${DISPOSITIVO_API_KEY:}
  dados-api-key: ${DADOS_API_KEY:}
  dev-origin: ${PF_DEV_ORIGIN:http://localhost:4200}
  chat-limite-por-minuto: ${PF_CHAT_LIMITE_POR_MINUTO:10}
